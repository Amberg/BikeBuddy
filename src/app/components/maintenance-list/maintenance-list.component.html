<section class="px-6 pb-6">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-900">Kürzlich gewartet</h3>
        <a href="#" class="text-xs font-semibold text-gray-400 hover:text-primary">Alle anzeigen</a>
    </div>

    <div class="space-y-3">
        <div *ngFor="let item of maintenanceItems"
            class="bg-white p-3 rounded-xl shadow-sm border border-gray-50 flex items-center gap-4">
            <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-gray-400">
                <i class="fa-solid" [class]="item.icon"></i>
            </div>
            <div class="flex-1">
                <h4 class="text-sm font-bold text-gray-900">{{ item.name }}</h4>
                <p class="text-xs text-gray-500">{{ item.detail }}</p>
            </div>
            <div class="text-right">
                <span class="block text-xs font-bold" [class]="item.statusClass">{{ item.status }}</span>
                <span class="text-[10px] text-gray-400">{{ item.date }}</span>
            </div>
        </div>
    </div>
</section>
