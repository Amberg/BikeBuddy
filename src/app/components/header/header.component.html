<header id="header" class="px-6 pt-12 pb-4 flex justify-between items-center bg-white z-10 w-full">
    <button
        class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center border border-gray-100 shadow-sm hover:bg-gray-100 transition-colors">
        <i class="fa-solid fa-bars text-gray-700"></i>
    </button>
    <div class="flex flex-col items-center">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">{{ subtitle }}</span>
        <h1 class="text-lg font-bold text-primary">{{ title }}</h1>
    </div>
    <div class="relative">
        <button
            class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center border border-gray-100 shadow-sm hover:bg-gray-100 transition-colors">
            <i class="fa-regular fa-bell text-gray-700"></i>
        </button>
        <span *ngIf="notifications > 0"
            class="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
    </div>
</header>
