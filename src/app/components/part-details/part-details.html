<div id="detail-modal" class="fixed inset-0 z-50" *ngIf="isModalOpen && (selectedPart$ | async) as part">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" (click)="close()"></div>

    <!-- Modal Content -->
    <div
        class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[32px] p-8 transform transition-transform duration-300 ease-out shadow-[0_-10px_40px_rgba(0,0,0,0.1)] h-[85vh] flex flex-col animate-slide-up">

        <!-- Drag Handle -->
        <div class="w-full flex justify-center mb-6" (click)="close()">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full"></div>
        </div>

        <!-- Header -->
        <div class="flex justify-between items-start mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-900 mb-1">{{ part.name }}</h2>
                <p class="text-sm text-gray-500 font-medium">{{ part.subtitle }}</p>
            </div>
            <button (click)="close()"
                class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Main Image/Icon Placeholder -->
        <div
            class="w-full h-48 bg-gray-50 rounded-2xl mb-8 flex items-center justify-center relative overflow-hidden group">
            <!-- Decorative background shapes -->
            <div
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-gray-200 rounded-full opacity-20 filter blur-xl group-hover:bg-blue-100 transition-colors duration-500">
            </div>
            <i
                class="fa-solid fa-gear text-6xl text-gray-300 group-hover:text-primary transition-colors duration-300 relative z-10"></i>

            <!-- Status Badge -->
            <div
                class="absolute top-4 right-4 bg-white px-3 py-1 rounded-full shadow-sm text-xs font-bold border border-gray-100 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full" [class.bg-green-500]="part.statusText === 'Gut'"
                    [class.bg-yellow-500]="part.statusText === 'Beobachten'"
                    [class.bg-red-500]="part.statusText === 'Kritisch'"></span>
                <span [class]="part.statusColor">{{ part.statusText }}</span>
            </div>
        </div>

        <!-- Details Grid -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                <span class="text-xs text-gray-400 font-medium block mb-1">Einbau Datum</span>
                <div class="flex items-center gap-2">
                    <i class="fa-regular fa-calendar text-gray-400 text-sm"></i>
                    <span class="text-sm font-bold text-gray-900">{{ part.installationDate | date:'dd.MM.yyyy' }}</span>
                </div>
            </div>
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                <span class="text-xs text-gray-400 font-medium block mb-1">Laufleistung</span>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-road text-gray-400 text-sm"></i>
                    <span class="text-sm font-bold text-gray-900">2,450 km</span>
                </div>
            </div>
        </div>

        <!-- Wear Indicator Section -->
        <div class="mb-auto">
            <div class="flex justify-between items-end mb-2">
                <span class="text-sm font-bold text-gray-900">Abnutzung</span>
                <span class="text-2xl font-bold text-gray-900">{{ part.wearLevel }}%</span>
            </div>

            <!-- Custom Progress Bar -->
            <div class="h-4 w-full bg-gray-100 rounded-full overflow-hidden relative">
                <div class="h-full rounded-full transition-all duration-1000 ease-out relative"
                    [ngStyle]="getWearBarStyle(part.wearLevel)">
                    <div class="absolute right-0 top-0 bottom-0 w-1 bg-white/30"></div>
                </div>
            </div>
            <div class="flex justify-between mt-2 text-[10px] text-gray-400 uppercase font-semibold tracking-wider">
                <span>Neu</span>
                <span>Ersetzen</span>
            </div>

            <p class="mt-4 text-xs leading-relaxed p-3 rounded-lg border flex gap-2" [class]="part.recommendationClass">
                <i class="fa-solid mt-0.5" [class]="part.recommendationIcon"></i>
                <span>{{ part.recommendation }}</span>
            </p>
        </div>

        <!-- Actions Footer -->
        <div class="mt-6 pt-4 border-t border-gray-100 grid grid-cols-5 gap-3">
            <button
                class="col-span-1 h-14 rounded-2xl border border-gray-200 text-gray-400 flex items-center justify-center hover:bg-gray-50 transition-colors">
                <i class="fa-regular fa-heart"></i>
            </button>
            <button
                class="col-span-4 h-14 bg-primary text-white rounded-2xl font-bold shadow-lg shadow-gray-200 hover:bg-gray-800 transition-colors flex items-center justify-center gap-2">
                <span>Wartung eintragen</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </div>
    </div>
</div>
