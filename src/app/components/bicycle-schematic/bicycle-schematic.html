<section id="schematic-view" class="p-6 relative">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-900">Teile Übersicht</h2>
    <div class="flex gap-2">
      <button
        class="px-3 py-1.5 bg-white text-xs font-semibold text-gray-700 rounded-lg shadow-sm border border-gray-100 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-green-500"></span> Gut
      </button>
      <button
        class="px-3 py-1.5 bg-white text-xs font-semibold text-gray-700 rounded-lg shadow-sm border border-gray-100 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-red-500"></span> Wartung
      </button>
    </div>
  </div>

  <!-- Interactive Bike Schematic Container -->
  <div
    class="relative bg-white rounded-[24px] p-4 shadow-card h-[380px] flex items-center justify-center overflow-hidden border border-gray-100">

    <!-- Background decorative elements similar to shoe app -->
    <div
      class="absolute top-0 right-0 w-64 h-64 bg-blue-50 rounded-full filter blur-3xl opacity-30 -translate-y-1/2 translate-x-1/2">
    </div>
    <div
      class="absolute bottom-0 left-0 w-48 h-48 bg-purple-50 rounded-full filter blur-3xl opacity-30 translate-y-1/2 -translate-x-1/2">
    </div>

    <!-- SVG Bike Diagram -->
    <svg viewBox="0 0 800 500" class="w-full h-full drop-shadow-lg transform scale-105" id="bike-schematic">
      <!-- Bike Frame Outline (Simplified for schematic) -->
      <path d="M250,350 L400,350 L550,200 L350,200 L250,350" fill="none" stroke="#E5E7EB" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round" />
      <path d="M550,200 L580,100" fill="none" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round" />
      <path d="M250,350 L200,150" fill="none" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round" />
      <path d="M200,150 L350,200" fill="none" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round" />

      <!-- Wheels -->
      <circle cx="200" cy="350" r="120" fill="none" stroke="#E5E7EB" stroke-width="8" />
      <circle cx="600" cy="350" r="120" fill="none" stroke="#E5E7EB" stroke-width="8" />

      <!-- Interactive Parts (Hotspots) -->

      <!-- p1: Chain/Drivetrain -->
      <g class="group cursor-pointer" (click)="selectPart('p1')">
        <circle cx="250" cy="350" r="40" fill="transparent" /> <!-- Invisible larger touch target -->
        <path d="M250,350 L400,350" stroke="#1F2937" stroke-width="4" class="opacity-80" />
        <circle cx="250" cy="350" r="25" fill="#1F2937" class="opacity-10 group-hover:opacity-25 transition-opacity" />
        <circle cx="250" cy="350" r="12" fill="#EF4444" class="animate-pulse shadow-lg" />
        <foreignObject x="210" y="380" width="80" height="30">
          <div xmlns="http://www.w3.org/1999/xhtml" class="flex justify-center">
            <span
              class="bg-white/90 backdrop-blur-sm px-2 py-0.5 rounded text-[10px] font-bold shadow-sm text-red-500 border border-red-100">Kette</span>
          </div>
        </foreignObject>
      </g>

      <!-- p2: Rear Derailleur -->
      <g class="group cursor-pointer" (click)="selectPart('p2')">
        <circle cx="400" cy="350" r="40" fill="transparent" /> <!-- Invisible larger touch target -->
        <circle cx="400" cy="350" r="20" fill="#1F2937" class="opacity-10 group-hover:opacity-25 transition-opacity" />
        <circle cx="400" cy="350" r="10" fill="#10B981" class="shadow-lg" />
        <foreignObject x="360" y="380" width="80" height="30">
          <div xmlns="http://www.w3.org/1999/xhtml" class="flex justify-center">
            <span
              class="bg-white/90 backdrop-blur-sm px-2 py-0.5 rounded text-[10px] font-bold shadow-sm text-gray-600">Schaltwerk</span>
          </div>
        </foreignObject>
      </g>

      <!-- p3: Front Brake -->
      <g class="group cursor-pointer" (click)="selectPart('p3')">
        <circle cx="600" cy="350" r="50" fill="transparent" /> <!-- Invisible larger touch target -->
        <rect x="580" y="320" width="40" height="60" rx="10" fill="#1F2937"
          class="opacity-10 group-hover:opacity-25 transition-opacity" />
        <circle cx="600" cy="350" r="10" fill="#F59E0B" class="shadow-lg" />
        <foreignObject x="610" y="335" width="80" height="30">
          <div xmlns="http://www.w3.org/1999/xhtml" class="flex justify-center">
            <span
              class="bg-white/90 backdrop-blur-sm px-2 py-0.5 rounded text-[10px] font-bold shadow-sm text-gray-600">Bremse
              V</span>
          </div>
        </foreignObject>
      </g>

      <!-- p4: Saddle -->
      <g class="group cursor-pointer" (click)="selectPart('p4')">
        <circle cx="210" cy="150" r="40" fill="transparent" />
        <path d="M180,150 L240,150" stroke="#1F2937" stroke-width="12" stroke-linecap="round"
          class="opacity-20 group-hover:opacity-40 transition-opacity" />
        <circle cx="210" cy="150" r="10" fill="#10B981" class="shadow-lg" />
      </g>

      <!-- p5: Handlebars -->
      <g class="group cursor-pointer" (click)="selectPart('p5')">
        <circle cx="580" cy="100" r="40" fill="transparent" />
        <path d="M550,100 L610,100" stroke="#1F2937" stroke-width="8" stroke-linecap="round"
          class="opacity-20 group-hover:opacity-40 transition-opacity" />
        <circle cx="580" cy="100" r="10" fill="#10B981" class="shadow-lg" />
      </g>
    </svg>

    <!-- Floating hint -->
    <div
      class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-md px-4 py-2 rounded-full shadow-sm border border-gray-100 flex items-center gap-2">
      <i class="fa-solid fa-hand-pointer text-gray-400 text-xs"></i>
      <span class="text-xs text-gray-500 font-medium">Tippen für Details</span>
    </div>
  </div>
</section>
